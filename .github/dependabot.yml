version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft-dotnet-10:
        patterns:
          - "Microsoft.*"
        update-types:
          - patch

  - package-ecosystem: npm
    directory: /tools/contracts
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
