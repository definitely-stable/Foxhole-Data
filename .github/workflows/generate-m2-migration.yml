name: Generate M2 migration

on:
  push:
    branches:
      - m2-a/evidence-registry
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: m2-a/evidence-registry

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore FoxData.slnx --locked-mode

      - name: Build
        run: dotnet build FoxData.slnx -c Release --no-restore

      - name: Generate migration
        env:
          FOXDATA_DESIGN_CONNECTION: Host=localhost;Database=foxdata;Username=foxdata;Password=design
        run: >-
          dotnet ef migrations add M2EvidenceKernelInitial
          --project src/FoxData.Infrastructure/FoxData.Infrastructure.csproj
          --startup-project src/FoxData.Api/FoxData.Api.csproj
          --output-dir Persistence/Migrations
          --configuration Release
          --no-build

      - name: Commit migration
        shell: bash
        run: |
          git add src/FoxData.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo "No migration changes generated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: generate M2 evidence kernel migration"
          git push origin HEAD:m2-a/evidence-registry
