name: CI

on:
  pull_request:
    branches:
      - main
      - architecture/foundation-specs
  push:
    branches:
      - main
      - architecture/foundation-specs

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Verify EF tool
        run: dotnet ef --version

      - name: Restore dependencies
        run: dotnet restore FoxData.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format FoxData.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build FoxData.slnx -c Release --no-restore

      - name: Verify CLI bootstrap
        shell: bash
        run: |
          dotnet run --project src/FoxData.Cli/FoxData.Cli.csproj -c Release --no-build -- --help >/dev/null
          dotnet run --project src/FoxData.Cli/FoxData.Cli.csproj -c Release --no-build -- --version >/dev/null

      - name: Unit tests
        run: >-
          dotnet test
          --project tests/FoxData.UnitTests/FoxData.UnitTests.csproj
          -c Release
          --no-build
          --minimum-expected-tests 10

      - name: Integration tests
        run: >-
          dotnet test
          --project tests/FoxData.IntegrationTests/FoxData.IntegrationTests.csproj
          -c Release
          --no-build
          --minimum-expected-tests 20

      - name: Recovery tests
        run: >-
          dotnet test
          --project tests/FoxData.RecoveryTests/FoxData.RecoveryTests.csproj
          -c Release
          --no-build
          --minimum-expected-tests 5

      - name: Source tests
        run: >-
          dotnet test
          --project tests/FoxData.SourceTests/FoxData.SourceTests.csproj
          -c Release
          --no-build
          --minimum-expected-tests 1

      - name: Contract tests
        run: >-
          dotnet test
          --project tests/FoxData.ContractTests/FoxData.ContractTests.csproj
          -c Release
          --no-build
          --minimum-expected-tests 2

  compose-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Start stack
        run: docker compose up --detach --build

      - name: Verify migration job succeeded
        shell: bash
        run: |
          migrate_id="$(docker compose ps --all --quiet migrate)"
          test -n "$migrate_id"
          test "$(docker inspect --format '{{.State.Status}}' "$migrate_id")" = "exited"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$migrate_id")" = "0"

      - name: Wait for API readiness
        run: >-
          curl
          --fail
          --silent
          --show-error
          --retry 30
          --retry-delay 2
          --retry-all-errors
          http://127.0.0.1:8080/health/ready

      - name: Verify runtime OpenAPI
        run: curl --fail --silent --show-error http://127.0.0.1:8080/openapi/v1.json >/dev/null

      - name: Verify Worker is running
        shell: bash
        run: |
          worker_id="$(docker compose ps --quiet worker)"
          test -n "$worker_id"
          test "$(docker inspect --format '{{.State.Running}}' "$worker_id")" = "true"

      - name: Show stack state
        if: always()
        run: docker compose ps --all

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
