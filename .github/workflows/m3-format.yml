name: Format M3 Branch

on:
  push:
    branches:
      - feat/m3-official-war-api-adapter

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[m3-formatted]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore FoxData.slnx --locked-mode
      - name: Format
        run: dotnet format FoxData.slnx --no-restore
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format M3 implementation [m3-formatted]"
          git push
