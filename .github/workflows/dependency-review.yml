name: Dependency Review

on:
  pull_request:
    branches:
      - main
      - architecture/foundation-specs

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check whether Dependency Graph is enabled
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          status="$(
            curl --silent --show-error               --output /dev/null               --write-out '%{http_code}'               --header "Authorization: Bearer ${GH_TOKEN}"               --header "Accept: application/vnd.github+json"               --header "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/${REPOSITORY}/dependency-graph/sbom"
          )"

          if [[ "${status}" == "200" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::GitHub Dependency Graph is not enabled for this repository (HTTP ${status}); Dependency Review is skipped. NuGet Audit remains enforced by the .NET CI."
          fi

      - name: Review dependency changes
        if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
