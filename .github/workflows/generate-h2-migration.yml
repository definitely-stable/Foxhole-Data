name: Generate H2 migration

on:
  push:
    branches:
      - m2-hardening/lifecycle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FOXDATA_DESIGN_CONNECTION: Host=localhost;Port=5432;Database=foxdata_design;Username=foxdata;Password=design

    steps:
      - uses: actions/checkout@v7
        with:
          ref: m2-hardening/lifecycle

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet tool restore
      - run: dotnet restore FoxData.slnx --locked-mode

      - name: Generate forward migration
        run: >-
          dotnet ef migrations add M2HardeningCurrentCaptureNaming
          --project src/FoxData.Infrastructure/FoxData.Infrastructure.csproj
          --startup-project src/FoxData.Api/FoxData.Api.csproj
          --context FoxDataDbContext
          --output-dir Persistence/Migrations
          --no-build

      - name: Commit generated migration
        shell: bash
        run: |
          git add src/FoxData.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo "No migration changes generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "db: rename endpoint current capture marker"
          git push origin HEAD:m2-hardening/lifecycle
