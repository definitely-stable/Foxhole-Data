name: Contracts

on:
  pull_request:
    branches:
      - main
      - architecture/foundation-specs
  push:
    branches:
      - main
      - architecture/foundation-specs

permissions:
  contents: read

jobs:
  validate:
    name: Validate contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/contracts/package-lock.json

      - name: Install contract tools
        working-directory: tools/contracts
        run: npm ci

      - name: Validate OpenAPI and AsyncAPI
        working-directory: tools/contracts
        run: npm run lint
