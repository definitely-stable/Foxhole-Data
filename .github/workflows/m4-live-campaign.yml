          run_id: m4-ci-${{ github.run_id }}
          observer_region: ${{ inputs.observer_region }}
          final_segment: "false"

  segment_11:
    name: M4-E 11 · live3
    needs: segment_10
    if: ${{ inputs.mode == 'full' }}
