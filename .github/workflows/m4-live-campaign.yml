name: M4 Live Campaign
run-name: M4-E auto-48h · ${{ github.sha }}

on:
  pull_request:
    paths:
      - .github/workflows/m4-live-campaign.yml
      - .github/actions/m4-segment/action.yml
      - .github/workflows/m4-checkpoint-rehearsal.yml
      - .github/scripts/m4-checkpoint.sh
      - .github/scripts/m4-postgres.sh
  push:
    branches:
      - main
    paths:
      - .work/M4_E_V2_START
      - .work/M4_E_V2_RETRY_01
      - .work/M4_E_V3_START
permissions:
  contents: read
  actions: write

concurrency:
  group: m4-live-campaign
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  validate-definition:
    name: Validate M4-E workflow definition
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate YAML and embedded shell syntax
        shell: bash
        run: |
          set -euo pipefail

          ruby <<'RUBY'
          require "yaml"

          files = [
            ".github/workflows/m4-live-campaign.yml",
            ".github/workflows/m4-checkpoint-rehearsal.yml",
            ".github/actions/m4-segment/action.yml",
          ]

          files.each do |path|
            document = YAML.load_file(path)
            scripts = []
            walk = nil
            walk = lambda do |value|
              case value
              when Hash
                value.each do |key, child|
                  scripts << child if key.to_s == "run" && child.is_a?(String)
                  walk.call(child)
                end
              when Array
                value.each { |child| walk.call(child) }
              end
            end
            walk.call(document)

            scripts.each_with_index do |script, index|
              sanitized = script.gsub(/\$\{\{.*?\}\}/, "GITHUB_EXPR")
              target = "/tmp/m4-action-#{File.basename(path)}-#{index}.sh"
              File.write(target, sanitized)
              abort("bash syntax failed for #{path} run block #{index}") unless system("bash", "-n", target)
            end
          end

          workflow = YAML.load_file(".github/workflows/m4-live-campaign.yml")
          jobs = workflow.fetch("jobs")
          expected = (1..12).map { |number| format("segment_%02d", number) }
          missing = expected.reject { |job| jobs.key?(job) }
          abort("Missing M4 segment jobs: #{missing.join(', ')}") unless missing.empty?

          action = YAML.load_file(".github/actions/m4-segment/action.yml")
          abort("M4 segment action is not composite") unless action.dig("runs", "using") == "composite"

          action_text = File.read(".github/actions/m4-segment/action.yml")
          save_at = action_text.index("- name: Save campaign checkpoint")
          analyze_at = action_text.index("- name: Analyze segment evidence")
          abort("M4 segment must persist its checkpoint before analysis") unless save_at && analyze_at && save_at < analyze_at
          abort("M4 segment must support exact completed-segment resume") unless action_text.include?("Resolve completed segment resume state")
          abort("M4 segment must keep a recovery artifact") unless action_text.include?("Upload campaign checkpoint recovery artifact")
          RUBY

          bash -n .github/scripts/m4-checkpoint.sh
          bash -n .github/scripts/m4-postgres.sh

  checkpoint_rehearsal:
    name: M4 checkpoint rehearsal gate
    uses: ./.github/workflows/m4-checkpoint-rehearsal.yml

  smoke:
    name: M4-E workflow smoke
    needs: checkpoint_rehearsal
    if: ${{ github.event_name == 'push' && needs.checkpoint_rehearsal.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run six-minute baseline segment
        uses: ./.github/actions/m4-segment
        with:
          segment_id: smoke
          phase: baseline-live1
          duration_minutes: "6"
          previous_cache_key: ""
          checkpoint_cache_key: m4-e-${{ github.run_id }}-smoke
          run_id: m4-ci-${{ github.run_id }}
          observer_region: github-actions-hosted-variable
          final_segment: "false"

      - name: Delete smoke checkpoint cache
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method DELETE \
            "/repos/$GITHUB_REPOSITORY/actions/caches?key=m4-e-$GITHUB_RUN_ID-smoke" \
            >/dev/null 2>&1 || true

  segment_01:
    name: M4-E 01 · baseline-live1
    needs: smoke
    if: ${{ always() && github.event_name == 'push' && needs.smoke.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run M4 segment
        uses: ./.github/actions/m4-segment
        with:
          segment_id: s01
          phase: baseline-live1
          duration_minutes: "240"
          previous_cache_key: ""
          checkpoint_cache_key: m4-e-${{ github.run_id }}-s01
          run_id: m4-ci-${{ github.run_id }}
          observer_region: github-actions-hosted-variable
          final_segment: "false"

  segment_02:
    name: M4-E 02 · probe-live1
    needs: segment_01
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run M4 segment
        uses: ./.github/actions/m4-segment
        with:
          segment_id: s02
          phase: probe-live1
          duration_minutes: "240"
          previous_cache_key: m4-e-${{ github.run_id }}-s01
          checkpoint_cache_key: m4-e-${{ github.run_id }}-s02
          run_id: m4-ci-${{ github.run_id }}
          observer_region: github-actions-hosted-variable
          final_segment: "false"

  segment_03:
    name: M4-E 03 · probe-live1
    needs: segment_02
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run M4 segment
        uses: ./.github/actions/m4-segment
        with:
          segment_id: s03
          phase: probe-live1
          duration_minutes: "240"
          previous_cache_key: m4-e-${{ github.run_id }}-s02
          checkpoint_cache_key: m4-e-${{ github.run_id }}-s03
          run_id: m4-ci-${{ github.run_id }}
          observer_region: github-actions-hosted-variable
          final_segment: "false"

  segment_04:
    name: M4-E 04 · live2
    needs: segment_03
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run M4 segment
        uses: ./.github/actions/m4-segment
        with:
          segment_id: s04
          phase: live2
          duration_minutes: "240"
          previous_cache_key: m4-e-${{ github.run_id }}-s03
          checkpoint_cache_key: m4-e-${{ github.run_id }}-s04
          run_id: m4-ci-${{ github.run_id }}
          observer_region: github-actions-hosted-variable
          final_segment: "false"

  segment_05:
    name: M4-E 05 · live2
    needs: segment_04
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run M4 segment
        uses: ./.github/actions/m4-segment
        with:
          segment_id: s05
          phase: live2
          duration_minutes: "240"
          previous_cache_key: m4-e-${{ github.run_id }}-s04
          checkpoint_cache_key: m4-e-${{ github.run_id }}-s05
          run_id: m4-ci-${{ github.run_id }}
          observer_region: github-actions-hosted-variable
          final_segment: "false"

  segment_06:
    name: M4-E 06 · live3
    needs: segment_05
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run M4 segment
        uses: ./.github/actions/m4-segment
        with:
          segment_id: s06
          phase: live3
          duration_minutes: "240"
          previous_cache_key: m4-e-${{ github.run_id }}-s05
          checkpoint_cache_key: m4-e-${{ github.run_id }}-s06
          run_id: m4-ci-${{ github.run_id }}
          observer_region: github-actions-hosted-variable
          final_segment: "false"

  segment_07:
    name: M4-E 07 · live3
    needs: segment_06
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run M4 segment
        uses: ./.github/actions/m4-segment
        with:
          segment_id: s07
          phase: live3
          duration_minutes: "240"
          previous_cache_key: m4-e-${{ github.run_id }}-s06
          checkpoint_cache_key: m4-e-${{ github.run_id }}-s07
          run_id: m4-ci-${{ github.run_id }}
          observer_region: github-actions-hosted-variable
          final_segment: "false"

  segment_08:
    name: M4-E 08 · live3
    needs: segment_07
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run M4 segment
        uses: ./.github/actions/m4-segment
        with:
          segment_id: s08
          phase: live3
          duration_minutes: "240"
          previous_cache_key: m4-e-${{ github.run_id }}-s07
          checkpoint_cache_key: m4-e-${{ github.run_id }}-s08
          run_id: m4-ci-${{ github.run_id }}
          observer_region: github-actions-hosted-variable
          final_segment: "false"

  segment_09:
    name: M4-E 09 · live3
    needs: segment_08
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run M4 segment
        uses: ./.github/actions/m4-segment
        with:
          segment_id: s09
          phase: live3
          duration_minutes: "240"
          previous_cache_key: m4-e-${{ github.run_id }}-s08
          checkpoint_cache_key: m4-e-${{ github.run_id }}-s09
          run_id: m4-ci-${{ github.run_id }}
          observer_region: github-actions-hosted-variable
          final_segment: "false"

  segment_10:
    name: M4-E 10 · live3
    needs: segment_09
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run M4 segment
        uses: ./.github/actions/m4-segment
        with:
          segment_id: s10
          phase: live3
          duration_minutes: "240"
          previous_cache_key: m4-e-${{ github.run_id }}-s09
          checkpoint_cache_key: m4-e-${{ github.run_id }}-s10
          run_id: m4-ci-${{ github.run_id }}
          observer_region: github-actions-hosted-variable
          final_segment: "false"

  segment_11:
    name: M4-E 11 · live3
    needs: segment_10
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run M4 segment
        uses: ./.github/actions/m4-segment
        with:
          segment_id: s11
          phase: live3
          duration_minutes: "240"
          previous_cache_key: m4-e-${{ github.run_id }}-s10
          checkpoint_cache_key: m4-e-${{ github.run_id }}-s11
          run_id: m4-ci-${{ github.run_id }}
          observer_region: github-actions-hosted-variable
          final_segment: "false"

  segment_12:
    name: M4-E 12 · live3
    needs: segment_11
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run M4 segment
        uses: ./.github/actions/m4-segment
        with:
          segment_id: s12
          phase: live3
          duration_minutes: "240"
          previous_cache_key: m4-e-${{ github.run_id }}-s11
          checkpoint_cache_key: m4-e-${{ github.run_id }}-s12
          run_id: m4-ci-${{ github.run_id }}
          observer_region: github-actions-hosted-variable
          final_segment: "true"

  finalize:
    name: M4-E analyze and validate
    needs: segment_12
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore final campaign checkpoint
        uses: actions/cache/restore@v6
        with:
          path: m4-ci/checkpoint
          key: m4-e-${{ github.run_id }}-s12
          fail-on-cache-miss: true

      - name: Start PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/m4-postgres.sh start foxdata-m4-postgres

      - name: Restore final PostgreSQL state
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/m4-checkpoint.sh restore foxdata-m4-postgres m4-ci/checkpoint

      - name: Restore and build exact campaign SHA
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore FoxData.slnx --locked-mode
          dotnet build FoxData.slnx -c Release --no-restore

      - name: Verify campaign identity
        shell: bash
        env:
          EXPECTED_RUN_ID: m4-ci-${{ github.run_id }}
          EXPECTED_OBSERVER_REGION: github-actions-hosted-variable
        run: |
          set -euo pipefail
          test -f m4-ci/checkpoint/campaign.json
          test -f m4-ci/checkpoint/measurement/storage-before.json
          test -f m4-ci/checkpoint/measurement/storage-after.json
          test -f m4-ci/checkpoint/segments.ndjson
          test "$(jq -r '.runId' m4-ci/checkpoint/campaign.json)" = "$EXPECTED_RUN_ID"
          test "$(jq -r '.repositorySha' m4-ci/checkpoint/campaign.json)" = "$GITHUB_SHA"
          test "$(jq -r '.observerRegion' m4-ci/checkpoint/campaign.json)" = "$EXPECTED_OBSERVER_REGION"
          test "$(jq -r '.endExclusive // empty' m4-ci/checkpoint/campaign.json)" != ""

      - name: Verify complete active campaign ledger
        shell: bash
        run: |
          set -euo pipefail

          ledger="m4-ci/checkpoint/segments.ndjson"
          segment_count="$(wc -l < "$ledger" | tr -d '[:space:]')"
          actual_segments="$(jq -r '.segment' "$ledger" | paste -sd, -)"
          actual_phases="$(jq -r '.phase' "$ledger" | paste -sd, -)"
          expected_segments="s01,s02,s03,s04,s05,s06,s07,s08,s09,s10,s11,s12"
          expected_phases="baseline-live1,probe-live1,probe-live1,live2,live2,live3,live3,live3,live3,live3,live3,live3"

          test "$segment_count" = "12"
          test "$actual_segments" = "$expected_segments"
          test "$actual_phases" = "$expected_phases"

          active_seconds="$(
            jq -s -r '
              [
                .[] |
                ((.endExclusive | fromdateiso8601) -
                 (.startInclusive | fromdateiso8601))
              ] | add | floor
            ' "$ledger"
          )"

          if (( active_seconds < 172800 )); then
            echo "M4-E recorded only $active_seconds active seconds; 172800 are required." >&2
            exit 1
          fi

          {
            echo "### M4-E campaign ledger"
            echo
            echo "- Segments: $segment_count"
            echo "- Active Worker seconds: $active_seconds"
            echo "- Phase plan: 4h baseline Live-1 → 8h probe Live-1 → 8h Live-2 expansion → 28h Live-3 expansion"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate final M4 report
        shell: bash
        run: |
          set -euo pipefail

          rm -rf m4-ci/final-report
          mkdir -p m4-ci/final-report
          cp \
            m4-ci/checkpoint/measurement/storage-before.json \
            m4-ci/final-report/storage-before.json
          cp \
            m4-ci/checkpoint/measurement/storage-after.json \
            m4-ci/final-report/storage-after.json
          cp \
            m4-ci/checkpoint/campaign.json \
            m4-ci/final-report/campaign.json
          cp \
            m4-ci/checkpoint/segments.ndjson \
            m4-ci/final-report/segments.ndjson

          run_id="$(jq -r '.runId' m4-ci/checkpoint/campaign.json)"
          start="$(jq -r '.startInclusive' m4-ci/checkpoint/campaign.json)"
          end="$(jq -r '.endExclusive' m4-ci/checkpoint/campaign.json)"
          observer="$(jq -r '.observerRegion' m4-ci/checkpoint/campaign.json)"
          sha="$(jq -r '.repositorySha' m4-ci/checkpoint/campaign.json)"

          ConnectionStrings__FoxData="Host=127.0.0.1;Port=5432;Database=foxdata;Username=foxdata;Password=foxdata_m4" \
            dotnet run \
              --project tools/FoxData.SourceMeasurement/FoxData.SourceMeasurement.csproj \
              -c Release \
              --no-build \
              -- \
              analyze \
              --run-id "$run_id" \
              --start "$start" \
              --end "$end" \
              --output m4-ci/final-report \
              --observer-region "$observer" \
              --repository-sha "$sha" \
              --profile-version warapi-bootstrap-profile@1 \
              --probe-shards live-1 \
              --probe-max-maps 3 \
              --probe-target-seconds 15 \
              --segments-file m4-ci/final-report/segments.ndjson

      - name: Validate M4 publication evidence
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ConnectionStrings__FoxData="Host=127.0.0.1;Port=5432;Database=foxdata;Username=foxdata;Password=foxdata_m4" \
            dotnet run \
              --project tools/FoxData.SourceMeasurement/FoxData.SourceMeasurement.csproj \
              -c Release \
              --no-build \
              -- \
              validate \
              --output m4-ci/final-report

      - name: Upload final measurement report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: m4-e-report-m4-ci-${{ github.run_id }}
          path: m4-ci/final-report
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Publish measurement summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f m4-ci/final-report/measurement-report.md ]]; then
            cat m4-ci/final-report/measurement-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -f m4-ci/final-report/measurement-validation.json ]]; then
            {
              echo
              echo "## Publication validation"
              echo
              echo '~~~json'
              cat m4-ci/final-report/measurement-validation.json
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce publication validation
        if: ${{ steps.validate.outcome != 'success' }}
        shell: bash
        run: |
          echo "M4 publication evidence validation failed." >&2
          exit 1

      - name: Stop PostgreSQL
        if: ${{ always() }}
        shell: bash
        run: bash .github/scripts/m4-postgres.sh stop foxdata-m4-postgres
