    name: M4-E 18 · live3
    needs: segment_17
    if: ${{ inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run M4 segment
