name: M4 Live Campaign
run-name: M4-E ${{ inputs.mode }} · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Smoke-check the campaign plumbing or run the full 72-hour measurement.
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - full
      observer_region:
        description: Coarse non-secret observer region label. Hosted runners should keep the default.
        required: true
        type: string
        default: github-actions-hosted-variable

permissions:
  contents: read
  actions: write

concurrency:
  group: m4-live-campaign
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  smoke:
    name: M4-E workflow smoke
    if: ${{ inputs.mode == 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run two-minute baseline segment
        uses: ./.github/actions/m4-segment
        with:
          segment_id: smoke
          phase: baseline-live1
          duration_minutes: "2"
          previous_cache_key: ""
          checkpoint_cache_key: m4-e-${{ github.run_id }}-smoke
          run_id: m4-ci-${{ github.run_id }}
          observer_region: ${{ inputs.observer_region }}
          final_segment: "false"

      - name: Delete smoke checkpoint cache
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method DELETE \
            "/repos/$GITHUB_REPOSITORY/actions/caches?key=m4-e-$GITHUB_RUN_ID-smoke" \
            >/dev/null 2>&1 || true

  segment_01:
    name: M4-E 01 · baseline-live1
    if: ${{ inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run M4 segment
        uses: ./.github/actions/m4-segment
        with:
          segment_id: s01
          phase: baseline-live1
          duration_minutes: "240"
          previous_cache_key: ""
          checkpoint_cache_key: m4-e-${{ github.run_id }}-s01
          run_id: m4-ci-${{ github.run_id }}
          observer_region: ${{ inputs.observer_region }}
          final_segment: "false"

  segment_02:
    name: M4-E 02 · baseline-live1
    needs: segment_01
    if: ${{ inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout exact campaign SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Run M4 segment
        uses: ./.github/actions/m4-segment
        with:
          segment_id: s02
          phase: baseline-live1
          duration_minutes: "240"
          previous_cache_key: m4-e-${{ github.run_id }}-s01
          checkpoint_cache_key: m4-e-${{ github.run_id }}-s02
          run_id: m4-ci-${{ github.run_id }}
          observer_region: ${{ inputs.observer_region }}
          final_segment: "false"

  segment_03:
    name: M4-E 03 · probe-live1
    needs: segment_02
    if: ${{ inputs.mode == 'full' }}
    runs-on: ubuntu-latest
