name: Refresh M2-D locks

on:
  push:
    branches:
      - m2-d/recovery-hardening
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: m2-d/recovery-hardening

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools and dependencies
        run: |
          dotnet tool restore
          dotnet restore FoxData.slnx

      - name: Commit lockfiles
        shell: bash
        run: |
          git add '**/packages.lock.json'
          if git diff --cached --quiet; then
            echo "No lockfile changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh M2-D lockfiles"
          git push origin HEAD:m2-d/recovery-hardening
