name: M4 Segment Job

on:
  workflow_call:
    inputs:
      segment_id:
        required: true
        type: string
      phase:
        required: true
        type: string
      previous_cache_key:
        required: false
        default: ""
        type: string
      checkpoint_cache_key:
        required: true
        type: string
      campaign_run_id:
        required: true
        type: string
      observer_region:
        required: true
        type: string
      campaign_repository_sha:
        required: true
        type: string
      final_segment:
        required: false
        default: false
        type: boolean
      preloaded_previous_checkpoint:
        required: false
        default: false
        type: boolean
      source_artifact_run_id:
        required: false
        default: ""
        type: string
      source_artifact_name:
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

jobs:
  segment:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout execution SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download preloaded checkpoint
        if: ${{ inputs.preloaded_previous_checkpoint }}
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.source_artifact_name }}
          path: m4-ci/checkpoint
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_artifact_run_id }}

      - name: Run M4 segment
        uses: ./.github/actions/m4-segment
        with:
          segment_id: ${{ inputs.segment_id }}
          phase: ${{ inputs.phase }}
          duration_minutes: "240"
          previous_cache_key: ${{ inputs.previous_cache_key }}
          checkpoint_cache_key: ${{ inputs.checkpoint_cache_key }}
          run_id: ${{ inputs.campaign_run_id }}
          observer_region: ${{ inputs.observer_region }}
          final_segment: ${{ inputs.final_segment && 'true' || 'false' }}
          preloaded_previous_checkpoint: ${{ inputs.preloaded_previous_checkpoint && 'true' || 'false' }}
          campaign_repository_sha: ${{ inputs.campaign_repository_sha }}
