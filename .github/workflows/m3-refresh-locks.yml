name: Refresh M3 Test Locks

on:
  push:
    branches:
      - feat/m3-official-war-api-adapter

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[m3-locks-refreshed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Refresh lock files
        run: dotnet restore FoxData.slnx --force-evaluate

      - name: Commit lock changes
        shell: bash
        run: |
          if git diff --quiet -- '**/packages.lock.json'; then
            echo "No lock changes generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/packages.lock.json'
          git commit -m "build: refresh M3 test locks [m3-locks-refreshed]"
          git push
