name: M4 Finalize Job

on:
  workflow_call:
    inputs:
      final_cache_key:
        required: true
        type: string
      campaign_run_id:
        required: true
        type: string
      observer_region:
        required: true
        type: string
      campaign_repository_sha:
        required: true
        type: string
      source_run_id:
        required: false
        default: ""
        type: string
      source_artifact:
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout execution SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore final checkpoint
        uses: actions/cache/restore@v6
        with:
          path: m4-ci/checkpoint
          key: ${{ inputs.final_cache_key }}
          fail-on-cache-miss: true

      - name: Start final PostgreSQL server
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/m4-postgres.sh start foxdata-m4-postgres

      - name: Restore final PostgreSQL state
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/m4-checkpoint.sh restore foxdata-m4-postgres m4-ci/checkpoint

      - name: Build execution SHA
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore FoxData.slnx --locked-mode
          dotnet build FoxData.slnx -c Release --no-restore

      - name: Verify complete campaign
        shell: bash
        env:
          EXPECTED_RUN_ID: ${{ inputs.campaign_run_id }}
          EXPECTED_OBSERVER_REGION: ${{ inputs.observer_region }}
          EXPECTED_REPOSITORY_SHA: ${{ inputs.campaign_repository_sha }}
        run: |
          set -euo pipefail

          test "$(jq -r '.runId' m4-ci/checkpoint/campaign.json)" = "$EXPECTED_RUN_ID"
          test "$(jq -r '.repositorySha' m4-ci/checkpoint/campaign.json)" = "$EXPECTED_REPOSITORY_SHA"
          test "$(jq -r '.observerRegion' m4-ci/checkpoint/campaign.json)" = "$EXPECTED_OBSERVER_REGION"
          test "$(jq -r '.endExclusive // empty' m4-ci/checkpoint/campaign.json)" != ""

          ledger="m4-ci/checkpoint/segments.ndjson"
          test "$(wc -l < "$ledger" | tr -d '[:space:]')" = "12"
          test "$(jq -r '.segment' "$ledger" | paste -sd, -)" = "s01,s02,s03,s04,s05,s06,s07,s08,s09,s10,s11,s12"
          test "$(jq -r '.phase' "$ledger" | paste -sd, -)" = "baseline-live1,probe-live1,probe-live1,live2,live2,live3,live3,live3,live3,live3,live3,live3"

          active_seconds="$(
            jq -s -r '
              [.[]
                | ((.endExclusive | fromdateiso8601) -
                   (.startInclusive | fromdateiso8601))]
              | add
              | floor
            ' "$ledger"
          )"

          if (( active_seconds < 172800 )); then
            echo "M4-E recorded only $active_seconds active seconds; 172800 required." >&2
            exit 1
          fi

      - name: Generate final report
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
        run: |
          set -euo pipefail

          rm -rf m4-ci/final-report
          mkdir -p m4-ci/final-report

          cp m4-ci/checkpoint/measurement/storage-before.json m4-ci/final-report/storage-before.json
          cp m4-ci/checkpoint/measurement/storage-after.json m4-ci/final-report/storage-after.json
          cp m4-ci/checkpoint/campaign.json m4-ci/final-report/campaign.json
          cp m4-ci/checkpoint/segments.ndjson m4-ci/final-report/segments.ndjson

          if [[ -n "$SOURCE_RUN_ID" ]]; then
            jq -n \
              --arg sourceRunId "$SOURCE_RUN_ID" \
              --arg sourceArtifact "$SOURCE_ARTIFACT" \
              --arg campaignRepositorySha "${{ inputs.campaign_repository_sha }}" \
              --arg recoveryRepositorySha "$GITHUB_SHA" \
              '{
                sourceRunId: $sourceRunId,
                sourceArtifact: $sourceArtifact,
                campaignRepositorySha: $campaignRepositorySha,
                recoveryRepositorySha: $recoveryRepositorySha,
                dataPlaneChanged: false
              }' > m4-ci/final-report/resume-provenance.json
          fi

          run_id="$(jq -r '.runId' m4-ci/checkpoint/campaign.json)"
          start="$(jq -r '.startInclusive' m4-ci/checkpoint/campaign.json)"
          end="$(jq -r '.endExclusive' m4-ci/checkpoint/campaign.json)"
          observer="$(jq -r '.observerRegion' m4-ci/checkpoint/campaign.json)"
          sha="$(jq -r '.repositorySha' m4-ci/checkpoint/campaign.json)"

          ConnectionStrings__FoxData="Host=127.0.0.1;Port=5432;Database=foxdata;Username=foxdata;Password=foxdata_m4" \
            dotnet run \
              --project tools/FoxData.SourceMeasurement/FoxData.SourceMeasurement.csproj \
              -c Release \
              --no-build \
              -- \
              analyze \
              --run-id "$run_id" \
              --start "$start" \
              --end "$end" \
              --output m4-ci/final-report \
              --observer-region "$observer" \
              --repository-sha "$sha" \
              --profile-version warapi-bootstrap-profile@1 \
              --probe-shards live-1 \
              --probe-max-maps 3 \
              --probe-target-seconds 15 \
              --segments-file m4-ci/final-report/segments.ndjson

      - name: Validate publication evidence
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ConnectionStrings__FoxData="Host=127.0.0.1;Port=5432;Database=foxdata;Username=foxdata;Password=foxdata_m4" \
            dotnet run \
              --project tools/FoxData.SourceMeasurement/FoxData.SourceMeasurement.csproj \
              -c Release \
              --no-build \
              -- \
              validate \
              --output m4-ci/final-report

      - name: Upload final report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: m4-e-report-${{ inputs.campaign_run_id }}-run-${{ github.run_id }}
          path: m4-ci/final-report
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Publish report summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -f m4-ci/final-report/measurement-report.md ]]; then
            cat m4-ci/final-report/measurement-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f m4-ci/final-report/resume-provenance.json ]]; then
            {
              echo
              echo "## Resume provenance"
              echo '~~~json'
              cat m4-ci/final-report/resume-provenance.json
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce publication validation
        if: ${{ steps.validate.outcome != 'success' }}
        shell: bash
        run: |
          echo "M4 publication evidence validation failed." >&2
          exit 1

      - name: Stop PostgreSQL
        if: ${{ always() }}
        shell: bash
        run: bash .github/scripts/m4-postgres.sh stop foxdata-m4-postgres
