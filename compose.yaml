services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: foxdata
      POSTGRES_USER: foxdata
      POSTGRES_PASSWORD: foxdata_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxdata -d foxdata"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - foxdata-postgres:/var/lib/postgresql

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/migrate/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    command:
      - --connection
      - Host=postgres;Port=5432;Database=foxdata;Username=foxdata;Password=foxdata_dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/docker/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FoxData: Host=postgres;Port=5432;Database=foxdata;Username=foxdata;Password=foxdata_dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: deploy/docker/worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__FoxData: Host=postgres;Port=5432;Database=foxdata;Username=foxdata;Password=foxdata_dev
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  foxdata-postgres:
